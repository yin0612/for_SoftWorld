name: 全站資料品質與更新檢查

on:
  schedule:
    # 每日台北 08:23 檢查；資料更新由 Worker 與聚合工作負責。
    - cron: '23 0 * * *'
  push:
    paths:
      - 'js/**'
      - 'config/**'
      - 'worker/src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/auto_update_data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查同步、日期、來源與資料完整性
        run: |
          python scripts/company_coverage.py --check
          node --test tests/*.test.mjs worker/src/*.test.mjs
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: 檢查正式網站更新狀態
        run: python scripts/update_data.py
      - name: 保存檢查結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-data-health
          path: data/site-health.json
          if-no-files-found: ignore
